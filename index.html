<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
    <title>Trafalgar Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
</head>

<body class="font-[Mulish] bg-white text-black">

    <!--Menu Bar-->
    <header class="sticky top-0 z-50 bg-white/50">
        <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4">
            <a href="#" class="flex items-center gap-3 no-underline group">

                <div
                    class="flex h-10 w-10 items-center justify-center rounded-full bg-[#458FF6] text-xl font-bold text-white select-none">
                    T
                </div>
                <span class="text-2xl font-bold text-[#233348]">Trafalgar</span>
            </a>

            <div class="flex items-center gap-8 md:gap-10">
                <a href="#" class="text-navbar-text/50 font-medium text-lg no-underline hover:text-navbar-text">Home</a>
                <a href="#" class="text-navbar-text/50 font-medium text-lg no-underline hover:text-navbar-text">Find a
                    Doctor</a>
                <a href="#" class="text-navbar-text/50 font-medium text-lg no-underline hover:text-navbar-text">Apps</a>
                <a href="#"
                    class="text-navbar-text/50 font-medium text-lg no-underline hover:text-navbar-text">Testimonials</a>
                <a href="#" class="text-navbar-text/50 font-medium text-lg no-underline hover:text-navbar-text">About
                    Us</a>
            </div>
        </nav>

    </header>

    <!--Hero Section-->
    <main>
        <section class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-8 px-4 py-12 lg:flex-row lg:py-16">
            <!-- Left Column: Content -->
            <div class="flex-1 space-y-6">
                <h1 class="text-4xl font-bold leading-[1.25] text-[#233348] sm:text-5xl">
                    Virtual healthcare <br>
                    for you
                </h1>
                <p class="text-lg text-[#7D7987]">
                    Trafalgar provides progressive, and affordable <br class="hidden sm:inline">
                    healthcare, accessible on mobile and online <br class="hidden sm:inline">
                    for everyone
                </p>
                <div class="pt-2">
                    <button class="cursor-pointer rounded-full bg-[#458FF6] px-10 py-3.5 text-base font-semibold text-white transition-all hover:bg-blue-600 hover:shadow-md">
                        Consult today
                    </button>
                </div>
            </div>

            <!-- Image -->
            <div class="flex flex-1 items-center justify-center lg:justify-end">
                <img src="./images/Hero_Section.png" alt="Virtual healthcare illustration" class="w-full max-w-lg lg:max-w-xl">
            </div>
        </section>
    </main>
</body>

</html>
